; =============================================================================
; config.example.ini - SAFE TEMPLATE (committed to Git)
; Copy this file to config/config.ini before running the pipeline:
;     cp config/config.example.ini config/config.ini
; config/config.ini is listed in .gitignore and must NEVER be committed.
; Put any real credentials (database host, user, password) only in config.ini.
; All paths are relative to the project root folder.
; =============================================================================

[paths]
erp_file = data/raw/erp_vendor_master.csv
manual_file = data/raw/manual_procurement_log.csv
db_file = data/output/pharmaceutical_procurement.db
ddl_file = sql/ddl_schema.sql
verification_file = sql/verification_queries.sql
quarantine_report = data/output/quarantine_report.csv
log_dir = logs

[validation]
; Expected results for the sample data (used to set the final status)
expected_master_rows = 5
expected_quarantine_rows = 3
